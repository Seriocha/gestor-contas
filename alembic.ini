# Configuração do Alembic. As migrações correm automaticamente no arranque
# da app (app/main.py). Para gerar uma nova migração em desenvolvimento:
#   python -m alembic revision --autogenerate -m "descricao"
# (usa GESTOR_DATA_DIR ou ./data/gestor.db como base de comparação)
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
