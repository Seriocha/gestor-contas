{% extends "base.html" %}
{% block titulo %}Perfil{% endblock %}
{% block conteudo %}
<h1>Perfil</h1>
<p><strong>{{ utilizador.nome }}</strong> · {{ utilizador.login }}{% if utilizador.email %} · {{ utilizador.email }}{% endif %}</p>
<h2>Alterar password</h2>
{% if erro %}<div class="aviso aviso-erro">{{ erro }}</div>{% endif %}
<form method="post" action="/perfil" class="formulario estreito">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>Password atual <input name="atual" type="password" autocomplete="current-password" required></label>
  <label>Nova password <input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
  <label>Repetir nova password <input name="password2" type="password" autocomplete="new-password" minlength="10" required></label>
  <button class="primario">Alterar password</button>
</form>
{% endblock %}
