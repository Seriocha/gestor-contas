{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block classe_main %}cartao-central{% endblock %}
{% block conteudo %}
<h1>Gestor de Contas</h1>
{% if erro %}<div class="aviso aviso-erro">{{ erro }}</div>{% endif %}
<form method="post" action="/login" class="formulario">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Utilizador <input name="login" value="{{ login or '' }}" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="primario">Entrar</button>
</form>
{% endblock %}
