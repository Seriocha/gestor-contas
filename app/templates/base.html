<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Gestor de Contas{% endblock %} · Gestor de Contas</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if utilizador %}
<header class="topo">
  <a class="marca" href="/">Gestor de Contas</a>
  <nav>
    <a href="/" {% if request.url.path == '/' %}class="ativo"{% endif %}>Painel</a>
    <a href="/contas" {% if request.url.path.startswith('/contas') %}class="ativo"{% endif %}>Contas</a>
    {% if utilizador.is_admin %}
    <a href="/admin/utilizadores" {% if request.url.path.startswith('/admin') %}class="ativo"{% endif %}>Administração</a>
    {% endif %}
  </nav>
  <div class="sessao">
    <a href="/perfil">{{ utilizador.nome }}</a>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <button class="ligacao">Sair</button>
    </form>
  </div>
</header>
{% endif %}
<main class="{% block classe_main %}conteudo{% endblock %}">
  {% for tipo, msg in flashes %}<div class="aviso aviso-{{ tipo }}">{{ msg }}</div>{% endfor %}
  {% block conteudo %}{% endblock %}
</main>
<footer class="rodape">v{{ versao }}</footer>
</body>
</html>
